<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:#e5e7eb;color:#111827;-webkit-font-smoothing:antialiased}
    a{color:#b91c1c;text-decoration:none}a:hover{color:#7f1d1d}
    .scr{width:390px;height:844px;background:#f9fafb;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .hd{padding:22px 18px 14px;background:#fff;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:12px}
    .ic{width:20px;height:20px;stroke:#374151;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .htitle{font-size:17px;font-weight:700}
    .body{flex:1;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:13px}
    .share{background:linear-gradient(135deg,#dc2626,#991b1b);border-radius:16px;padding:18px;color:#fff;box-shadow:0 14px 30px -14px rgba(220,38,38,.55)}
    .gift{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
    .cl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#fecaca;font-weight:600}
    .code{font-family:'Fraunces',serif;font-size:30px;font-weight:900;letter-spacing:.08em;margin-top:1px}
    .linkbox{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:10px;padding:9px 12px;margin-top:14px}
    .linktext{font-size:11.5px;color:#fee2e2;font-family:monospace;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .copybtn{font-size:11px;font-weight:600;background:#fff;color:#b91c1c;border-radius:8px;padding:5px 10px}
    .shbtns{display:flex;gap:8px;margin-top:12px}
    .shb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;border-radius:10px;padding:9px 0}
    .wa{background:#16a34a;color:#fff}.sms{background:rgba(255,255,255,.16);color:#fff}
    .shb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .st{background:#fff;border:1px solid #f3f4f6;border-radius:13px;padding:12px}
    .sto{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
    .stl{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.03em}
    .stv{font-size:19px;font-weight:800;margin-top:1px}
    .sect{font-size:14px;font-weight:700;margin:3px 2px 0}
    .friend{background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:12px}
    .fa{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .fn{font-size:13.5px;font-weight:600}.fd{font-size:11px;color:#9ca3af;margin-top:2px}
    .pill{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px}
  </style>
</helmet>
<div class="scr">
  <div class="hd">
    <svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="htitle">Refer &amp; earn</div>
  </div>

  <div class="body">
    <div class="share">
      <div style="display:flex;align-items:center;gap:13px">
        <div class="gift"><svg style="width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9"/><path d="M12 8S10 3 7.5 4.5 12 8 12 8zM12 8s2-5 4.5-3.5S12 8 12 8z"/></svg></div>
        <div><div class="cl">Your code</div><div class="code">SAHA24</div></div>
      </div>
      <div class="linkbox">
        <span class="linktext">studieo.app/register?ref=SAHA24</span>
        <span class="copybtn">Copy</span>
      </div>
      <div class="shbtns">
        <div class="shb wa"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20l1.1-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>WhatsApp</div>
        <div class="shb sms"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>SMS</div>
      </div>
    </div>

    <div class="stats">
      <div class="st"><div class="sto" style="background:#dbeafe"><svg style="width:17px;height:17px;stroke:#1d4ed8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-5 7-5s7 1.5 7 5"/><path d="M17 8h5M19.5 5.5v5"/></svg></div><div class="stl">Referred</div><div class="stv">3</div></div>
      <div class="st"><div class="sto" style="background:#dcfce7"><svg style="width:17px;height:17px;stroke:#15803d;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div><div class="stl">Rewarded</div><div class="stv">2</div></div>
      <div class="st"><div class="sto" style="background:#fce7f3"><svg style="width:17px;height:17px;stroke:#be185d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M11.5 3.5 14 9l6 .5-4.5 4 1.4 6-5.4-3.2L6.5 19.5 8 13.5 3.5 9.5 9.5 9z"/></svg></div><div class="stl">Points</div><div class="stv">200</div></div>
    </div>

    <div class="sect">Friends you&#39;ve referred</div>

    <div class="friend">
      <div class="fa" style="background:#dcfce7;color:#15803d"><svg style="width:19px;height:19px;stroke:#15803d;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div style="flex:1"><div class="fn">Meera Nair</div><div class="fd">Signed up 12 Aug</div></div>
      <span class="pill" style="background:#dcfce7;color:#15803d">+100 pts</span>
    </div>

    <div class="friend">
      <div class="fa" style="background:#dcfce7;color:#15803d"><svg style="width:19px;height:19px;stroke:#15803d;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div style="flex:1"><div class="fn">Karan Mehta</div><div class="fd">Signed up 6 Aug</div></div>
      <span class="pill" style="background:#dcfce7;color:#15803d">+100 pts</span>
    </div>

    <div class="friend">
      <div class="fa" style="background:#fef3c7;color:#b45309"><svg style="width:18px;height:18px;stroke:#b45309;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div style="flex:1"><div class="fn">Ravi Shankar</div><div class="fd">Invited 2 Aug</div></div>
      <span class="pill" style="background:#fef3c7;color:#b45309">Pending</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
