<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:#e5e7eb;color:#111827;-webkit-font-smoothing:antialiased}
    a{color:#b91c1c;text-decoration:none}a:hover{color:#7f1d1d}
    .scr{width:390px;height:844px;background:#f9fafb;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .hd{padding:22px 20px 14px;background:#111827;color:#fff}
    .brand{font-family:Fraunces,serif;font-weight:900;font-size:13px;color:#fca5a5}
    .htitle{font-size:20px;font-weight:800;margin-top:2px}
    .body{flex:1;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:13px}
    .earn{background:linear-gradient(135deg,#dc2626,#991b1b);border-radius:16px;padding:18px;color:#fff;box-shadow:0 14px 30px -14px rgba(220,38,38,.5)}
    .el{font-size:11.5px;color:#fecaca}
    .ev{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
    .esplit{display:flex;gap:10px;margin-top:14px}
    .ei{flex:1;background:rgba(255,255,255,.12);border-radius:11px;padding:10px 12px}
    .eil{font-size:10px;color:#fecaca}.eiv{font-size:14px;font-weight:700;margin-top:2px}
    .card{background:#fff;border:1px solid #f3f4f6;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px}
    .ct{font-size:13px;font-weight:700}
    .chart{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:118px;margin-top:14px}
    .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
    .bar{width:100%;border-radius:6px 6px 3px 3px;background:#fecaca}
    .bar.hi{background:#dc2626}
    .bx{font-size:10px;color:#9ca3af;font-weight:600}
    .brow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f6f7f8}
    .brow:last-child{border-bottom:none}
    .bo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .bo svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .bk{font-size:13px;font-weight:600;flex:1}
    .bsub{font-size:11px;color:#9ca3af}
    .bv{font-size:14px;font-weight:800}
    .payout{display:flex;align-items:center;justify-content:space-between;background:#dcfce7;border:1px solid #bbf7d0;border-radius:13px;padding:13px 15px}
    .tab{height:64px;background:#fff;border-top:1px solid #f3f4f6;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding-bottom:4px}
    .ti{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#9ca3af;font-weight:500}
    .ic{width:20px;height:20px;stroke:#9ca3af;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ti.on{color:#dc2626}.ti.on .ic{stroke:#dc2626}
  </style>
</helmet>
<div class="scr">
  <div class="hd">
    <div class="brand">Studie&#39;o · Staff</div>
    <div class="htitle">Earnings</div>
  </div>

  <div class="body">
    <div class="earn">
      <div class="el">This month · August</div>
      <div class="ev">₹32,450</div>
      <div class="esplit">
        <div class="ei"><div class="eil">Commission</div><div class="eiv">35%</div></div>
        <div class="ei"><div class="eil">Services</div><div class="eiv">58</div></div>
        <div class="ei"><div class="eil">Tips</div><div class="eiv">₹2,100</div></div>
      </div>
    </div>

    <div class="card">
      <div class="ct">Last 7 days</div>
      <div class="chart">
        <div class="bcol"><div class="bar" style="height:38%"></div><div class="bx">M</div></div>
        <div class="bcol"><div class="bar" style="height:56%"></div><div class="bx">T</div></div>
        <div class="bcol"><div class="bar" style="height:44%"></div><div class="bx">W</div></div>
        <div class="bcol"><div class="bar hi" style="height:82%"></div><div class="bx">T</div></div>
        <div class="bcol"><div class="bar" style="height:64%"></div><div class="bx">F</div></div>
        <div class="bcol"><div class="bar" style="height:96%"></div><div class="bx">S</div></div>
        <div class="bcol"><div class="bar" style="height:52%"></div><div class="bx">S</div></div>
      </div>
    </div>

    <div class="card">
      <div class="brow">
        <div class="bo" style="background:#fee2e2"><svg style="stroke:#dc2626" viewBox="0 0 24 24"><path d="M6 3l6 6 6-6M6 3v7a6 6 0 0 0 12 0V3"/></svg></div>
        <div class="bk">Service commission<div class="bsub">58 services</div></div>
        <div class="bv">₹28,350</div>
      </div>
      <div class="brow">
        <div class="bo" style="background:#dbeafe"><svg style="stroke:#1d4ed8" viewBox="0 0 24 24"><path d="M6 2h12l2 5H4z"/><path d="M4 7v13h16V7"/></svg></div>
        <div class="bk">Product sales<div class="bsub">12 items</div></div>
        <div class="bv">₹2,000</div>
      </div>
      <div class="brow">
        <div class="bo" style="background:#fce7f3"><svg style="stroke:#be185d" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/></svg></div>
        <div class="bk">Tips<div class="bsub">from customers</div></div>
        <div class="bv">₹2,100</div>
      </div>
    </div>

    <div class="payout">
      <div><div style="font-size:12px;color:#15803d;font-weight:600">Next payout</div><div style="font-size:16px;font-weight:800;color:#166534;margin-top:1px">₹32,450 · 1 Sep</div></div>
      <span style="font-size:11px;font-weight:700;color:#15803d;background:#bbf7d0;padding:4px 10px;border-radius:99px">Scheduled</span>
    </div>
  </div>

  <div class="tab">
    <div class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2 4 2 4H5"/></svg>Today</div>
    <div class="ti"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Schedule</div>
    <div class="ti on"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Earnings</div>
    <div class="ti"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
