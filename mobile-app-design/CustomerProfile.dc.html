<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:#e5e7eb;color:#111827;-webkit-font-smoothing:antialiased}
    a{color:#b91c1c;text-decoration:none}a:hover{color:#7f1d1d}
    .scr{width:390px;height:844px;background:#f9fafb;display:flex;flex-direction:column;overflow:hidden;position:relative}
    .hd{padding:22px 20px 14px;background:#fff;border-bottom:1px solid #f3f4f6}
    .htitle{font-size:19px;font-weight:800;letter-spacing:-.01em}
    .ic{width:20px;height:20px;stroke:#374151;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .body{flex:1;overflow:hidden;padding:16px 16px 0;display:flex;flex-direction:column;gap:12px}
    .pcard{background:#fff;border:1px solid #f3f4f6;border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .bigava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px}
    .pname{font-size:17px;font-weight:800}
    .pmeta{font-size:12px;color:#6b7280;margin-top:2px;display:flex;align-items:center;gap:5px}
    .pmeta svg{width:12px;height:12px;stroke:#9ca3af;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .edit{margin-left:auto;width:34px;height:34px;border-radius:10px;background:#fef2f2;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .menu{background:#fff;border:1px solid #f3f4f6;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .mi{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid #f6f7f8}
    .mi:last-child{border-bottom:none}
    .mio{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .mio svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .mit{font-size:14px;font-weight:600;flex:1}
    .mia{width:16px;height:16px;stroke:#cbd5e1;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .logout{display:flex;align-items:center;justify-content:center;gap:8px;color:#dc2626;font-weight:600;font-size:14px;padding:14px;border:1px solid #fecaca;border-radius:14px;background:#fff}
    .tab{height:64px;background:#fff;border-top:1px solid #f3f4f6;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding-bottom:4px}
    .ti{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#9ca3af;font-weight:500}
    .ti.on{color:#dc2626}.ti.on .ic{stroke:#dc2626}
  </style>
</helmet>
<div class="scr">
  <div class="hd"><div class="htitle">Profile</div></div>

  <div class="body">
    <div class="pcard">
      <div class="bigava">SD</div>
      <div style="flex:1;min-width:0">
        <div class="pname">Sahanaa Dhanapalan</div>
        <div class="pmeta"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>sahanaa@email.com</div>
        <div class="pmeta"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>+91 98765 43210</div>
      </div>
      <div class="edit"><svg style="width:16px;height:16px;stroke:#dc2626;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div>
    </div>

    <div class="menu">
      <div class="mi">
        <div class="mio" style="background:#eef2ff"><svg style="stroke:#4f46e5" viewBox="0 0 24 24"><path d="M4 4h13l3 4v12H4z"/><path d="M8 4v16M8 9h8M8 13h8"/></svg></div>
        <div class="mit">Payment history</div>
        <svg class="mia" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi">
        <div class="mio" style="background:#fee2e2"><svg style="stroke:#dc2626" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M5 12v9h14v-9"/></svg></div>
        <div class="mit">Refer &amp; earn</div>
        <span style="font-size:11px;font-weight:700;color:#dc2626;background:#fee2e2;padding:2px 8px;border-radius:99px;margin-right:6px">+100 pts</span>
        <svg class="mia" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi">
        <div class="mio" style="background:#fef3c7"><svg style="stroke:#d97706" viewBox="0 0 24 24"><path d="M12 2l3 6 6 .8-4.5 4.2 1.2 6L12 16l-5.9 3 1.2-6L3 8.8 9 8z"/></svg></div>
        <div class="mit">My reviews</div>
        <svg class="mia" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi">
        <div class="mio" style="background:#e0f2fe"><svg style="stroke:#0284c7" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
        <div class="mit">Notifications</div>
        <svg class="mia" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="mi">
        <div class="mio" style="background:#f3f4f6"><svg style="stroke:#4b5563" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg></div>
        <div class="mit">Data &amp; privacy</div>
        <svg class="mia" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div class="logout">
      <svg style="width:17px;height:17px;stroke:#dc2626;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Log out
    </div>
  </div>

  <div class="tab">
    <div class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</div>
    <div class="ti"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bookings</div>
    <div class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8l4 4 5-6 5 6 4-4v9H3z"/></svg>Membership</div>
    <div class="ti on"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</div>
  </div>
</div>
</x-dc>

</body>
</html>
