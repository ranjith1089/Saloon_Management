# Nixpacks configuration for Railway/Nixpacks builds
# This tells Nixpacks to build the backend from the monorepo

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["cd backend && npm install"]

[phases.build]
cmds = ["cd backend && npx prisma generate && npm run build"]

[start]
cmd = "cd backend && npx prisma migrate deploy && npm start"
