# Auto-deploy the frontend (React/Vite) build to Hostinger.
#
# HOW IT WORKS
#   1. On every push to `main`, this workflow builds frontend/ with
#      VITE_API_URL pointed at the Railway backend.
#   2. It force-pushes ONLY the contents of frontend/dist/ to a
#      dedicated `hostinger-deploy` branch (so no source is exposed).
#   3. Hostinger's Git integration is configured to pull `hostinger-deploy`
#      into public_html/, so the site updates within seconds of the push.
#
# ONE-TIME SETUP IN GITHUB
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  VITE_API_URL
#     Value: https://<your-railway-backend>.up.railway.app/api/v1
#
# ONE-TIME SETUP IN HOSTINGER (hPanel)
#   Websites → <your domain> → Auto Deploy from Git
#     Repository:  https://github.com/<user>/Saloon_Management
#     Branch:      hostinger-deploy
#     Path:        /public_html
#     Save → click "Deploy now" once so it grabs the first build.

name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Missing VITE_API_URL secret — set it in Settings → Secrets → Actions"
            exit 1
          fi
          npm run build

      - name: Publish dist/ to hostinger-deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd frontend/dist
          git init -q
          git checkout -b hostinger-deploy
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep a marker so Hostinger's git clone doesn't complain about empty repo
          echo "Built at $(date -u +%FT%TZ) from ${GITHUB_SHA::7}" > .deploy-info
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger-deploy
